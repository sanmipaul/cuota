<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Cuota</title>
  <rect width="512" height="512" rx="112" fill="#b4502a"/>
  <g transform="translate(0 22)">
    <!-- the payment, stepping up at each adjustment -->
    <path d="M104 408V340h84v-80h84v-80h84v-72h52v300z" fill="#fff6ec"/>
    <!-- a coin landing on the top step -->
    <circle cx="382" cy="76" r="26" fill="#e6b14e"/>
    <circle cx="382" cy="76" r="13" fill="none" stroke="#b4502a" stroke-width="5" opacity=".5"/>
  </g>
</svg>
